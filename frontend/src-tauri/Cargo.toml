[package]
name = "terry-comfy-launcher"
version = "0.1.0"
description = "ComfyUI launcher desktop shell"
authors = ["Terry"]
edition = "2021"

[lib]
name = "terry_comfy_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
# Win32_System_Registry / Win32_UI_* 供 WebView2 缺失时的原生提示窗口使用（不依赖 WebView2 本身）
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
