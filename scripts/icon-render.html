<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; overflow: hidden; }
  .icon {
    width: 1024px; height: 1024px;
    border-radius: 225px;
    background: linear-gradient(135deg, #5b8cff 0%, #4f7cff 38%, #7b6cf0 72%, #8b5cf6 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  /* soft top highlight */
  .icon::before {
    content: ''; position: absolute; left: 0; top: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0));
    border-radius: 225px 225px 0 0;
  }
  .mark {
    width: 620px; /* ~60% of canvas, matching brand circle-diameter padding rule */
    filter: drop-shadow(0 10px 22px rgba(30, 40, 120, .35));
  }
  .mark svg { width: 100%; height: auto; display: block; }
</style>
